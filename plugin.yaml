id: teams
name: Teams
version: "1.0.0"
hubra: ">=0.2,<1"
description: "Match days for team sports: fixtures from the league's calendar feed, who can play, the coach's line-up, and carpooling to away games."
author: Hubra
homepage: https://github.com/hubra-app/hubra-plugin-teams
tags: [teams, sports, matches, lineup, carpooling]
package: hubra_teams
modules: [teams]
requires: [members, groups]
migrations: migrations
